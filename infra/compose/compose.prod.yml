name: nskolesnikov-prod

# Как и в development, единственный источник настроек — `.env` в корне
# репозитория. Значения, которые нужны Compose на этапе разбора файла
# (`ports`, `server_name`), подставляются интерполяцией, поэтому production-стек
# запускается с `--env-file .env`:
#
#   docker compose --env-file .env -f infra/compose/compose.prod.yml up -d --build
#
# Обязательные переменные здесь не проверяются: приложение и PostgreSQL сами
# останавливаются с внятной ошибкой, если их нет.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу не публикуется: база доступна только из сети Compose.
    healthcheck:
      # $$ — экранирование для Compose: переменные читаются из окружения
      # контейнера, а не подставляются на этапе разбора файла.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: infra/docker/app/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_MEDIA_ROOT: /app/media
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Gunicorn читает WEB_CONCURRENCY самостоятельно.
      WEB_CONCURRENCY: ${GUNICORN_WORKERS:-3}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/nginx/Dockerfile
    restart: unless-stopped
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Только для чтения: Nginx их отдаёт, пишет их приложение.
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
