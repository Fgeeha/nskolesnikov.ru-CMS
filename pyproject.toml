[project]
name = "nskolesnikov-cms"
version = "0.1.0"
description = "Personal developer portfolio built with Django and django CMS"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-cms>=5.0,<5.1",
    "django-environ>=0.14.0",
    "django-filer>=3.5.0",
    "djangocms-text>=0.9.10",
    "easy-thumbnails>=2.10.1",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.16.1",
]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DJ",        # flake8-django
    "S",         # bandit
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "C90",       # mccabe
]
ignore = [
    "RUF001",  # Cyrillic text is intentional throughout this project
    "RUF002",
    "RUF003",
    "RUF012",  # Django class attributes are conventionally plain lists/tuples
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]  # assert and dummy secrets are the point of a test

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["cms.*", "filer.*", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --disable-warnings"

# --- coverage ---------------------------------------------------------------
[tool.coverage.run]
source = ["src/apps", "src/config"]
omit = ["*/migrations/*", "*/tests/*", "src/manage.py", "src/config/asgi.py", "src/config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
