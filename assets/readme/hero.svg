<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">nskolesnikov.ru — сайт-портфолио на Django и django CMS</title>
  <desc id="hero-desc">Слева название проекта и описание: персональный сайт-портфолио, содержимое которого собирается в django CMS без правок кода. Справа схема главной страницы из трёх плейсхолдеров — hero, sections и closing — заполненных CMS-плагинами.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#0b0f14"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>

  <g id="title-block" transform="translate(64 78)">
    <text font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19"
          letter-spacing="2.6" fill="#2dd4bf">DJANGO · DJANGO CMS · POSTGRESQL</text>

    <text y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="72" font-weight="700" letter-spacing="-1.6" fill="#e6edf3">nskolesnikov.ru</text>

    <text y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="25" fill="#93a4b8">Персональный сайт-портфолио разработчика.</text>
    <text y="168" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="25" fill="#93a4b8">Содержимое собирается в CMS, а не в коде.</text>

    <g transform="translate(0 214)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <text fill="#2dd4bf">$</text>
      <text x="20" fill="#93a4b8">docker compose -f infra/compose/compose.dev.yml up --build</text>
    </g>
  </g>

  <g id="page-composition" transform="translate(742 66)">
    <rect width="394" height="288" rx="16" fill="#131b24" stroke="#223040"/>

    <g transform="translate(20 20)">
      <circle cx="5" cy="5" r="4.5" fill="#31445a"/>
      <circle cx="21" cy="5" r="4.5" fill="#31445a"/>
      <circle cx="37" cy="5" r="4.5" fill="#31445a"/>
      <text x="354" y="9" text-anchor="end"
            font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="18" fill="#93a4b8">cms/home.html</text>
    </g>

    <line x1="0" y1="52" x2="394" y2="52" stroke="#223040"/>

    <g transform="translate(20 74)">
      <rect width="354" height="58" rx="10" fill="#0b0f14" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <text x="16" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="18" fill="#2dd4bf">hero</text>
      <text x="16" y="47" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="20" fill="#e6edf3">Hero</text>
    </g>

    <g transform="translate(20 142)">
      <rect width="354" height="58" rx="10" fill="#0b0f14" stroke="#31445a"/>
      <text x="16" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="18" fill="#93a4b8">sections</text>
      <text x="16" y="47" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="20" fill="#e6edf3">Навыки · Проекты · Статьи</text>
    </g>

    <g transform="translate(20 210)">
      <rect width="354" height="58" rx="10" fill="#0b0f14" stroke="#31445a"/>
      <text x="16" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="18" fill="#93a4b8">closing</text>
      <text x="16" y="47" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="20" fill="#e6edf3">Контакты</text>
    </g>
  </g>

  <text x="742" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" fill="#93a4b8">плейсхолдеры → плагины → страница</text>
</svg>
