{% load i18n %}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="/">
      <span class="brand__mark" aria-hidden="true">~/</span>
      <span class="brand__name">{{ profile.nickname|default:site_settings.site_name }}</span>
    </a>

    {% if profile.phone %}
      <a class="site-header__phone" href="tel:{{ profile.phone|cut:' ' }}">{{ profile.phone }}</a>
    {% endif %}

    <button class="nav-toggle" type="button"
            aria-expanded="false" aria-controls="primary-nav"
            aria-label="{% trans 'Открыть меню' %}">
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
    </button>

    <nav id="primary-nav" class="site-nav" aria-label="{% trans 'Основная навигация' %}">
      <ul class="site-nav__list">
        <li><a href="{% url 'portfolio:about' %}">{% trans "Обо мне" %}</a></li>
        <li><a href="{% url 'portfolio:project-list' %}">{% trans "Проекты" %}</a></li>
        <li><a href="{% url 'portfolio:mini-project-list' %}">{% trans "Мини-проекты" %}</a></li>
        <li><a href="{% url 'portfolio:resume' %}">{% trans "Опыт" %}</a></li>
        <li><a href="{% url 'blog:article-list' %}">{% trans "Статьи" %}</a></li>
        <li><a href="{% url 'contact:contact' %}">{% trans "Контакты" %}</a></li>
      </ul>

      <button class="theme-toggle" type="button" data-theme-toggle
              aria-label="{% trans 'Переключить тему' %}">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
          </g>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
